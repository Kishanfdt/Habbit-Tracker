version: '3.8'

services:
  mongodb:
    image: mongo:6-alpine
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/habittracker}
      JWT_SECRET: change-this-to-a-strong-secret-min-32-chars
      JWT_EXPIRES_IN: 7d
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
