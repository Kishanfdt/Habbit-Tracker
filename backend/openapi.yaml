openapi: 3.0.0
info:
  title: Habit Tracker API
  description: Foundation-hardened API for tracking habits with local calendar day streak calculations.
  version: 1.0.0
servers:
  - url: /
    description: Local / Current Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "64fa1e2b3c4d5e6f7a8b9c0d"
        email:
          type: string
          format: email
          example: "user@example.com"
        timezone:
          type: string
          example: "Asia/Kolkata"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - timezone

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    Streaks:
      type: object
      properties:
        currentStreak:
          type: integer
          example: 5
        longestStreak:
          type: integer
          example: 12
      required:
        - currentStreak
        - longestStreak

    Habit:
      type: object
      properties:
        id:
          type: string
          example: "64fa1e2b3c4d5e6f7a8b9c0e"
        user_id:
          type: string
          example: "64fa1e2b3c4d5e6f7a8b9c0d"
        name:
          type: string
          example: "Morning Jog"
        description:
          type: string
          nullable: true
          example: "Jog 5km around the park"
        category:
          type: string
          enum: [health, productivity, learning, fitness, other]
          example: "fitness"
        archived:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - name
        - archived
        - created_at

    HabitWithStreaks:
      allOf:
        - $ref: '#/components/schemas/Habit'
        - type: object
          properties:
            streaks:
              $ref: '#/components/schemas/Streaks'
            checkedInToday:
              type: boolean
              example: true
          required:
            - streaks
            - checkedInToday

    CheckIn:
      type: object
      properties:
        id:
          type: string
          example: "64fa1e2b3c4d5e6f7a8b9c0f"
        habit_id:
          type: string
          example: "64fa1e2b3c4d5e6f7a8b9c0e"
        user_id:
          type: string
          example: "64fa1e2b3c4d5e6f7a8b9c0d"
        checked_in_at:
          type: string
          format: date-time
        local_date:
          type: string
          example: "2026-09-09"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - habit_id
        - user_id
        - checked_in_at
        - local_date

    HabitDetail:
      allOf:
        - $ref: '#/components/schemas/Habit'
        - type: object
          properties:
            streaks:
              $ref: '#/components/schemas/Streaks'
            checkIns:
              type: array
              items:
                $ref: '#/components/schemas/CheckIn'
          required:
            - streaks
            - checkIns

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 3
      required:
        - page
        - limit
        - total
        - totalPages

    PaginatedHabits:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HabitWithStreaks'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - data
        - pagination

    PaginatedCheckIns:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CheckIn'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required:
        - data
        - pagination

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid request parameters"
      required:
        - error

paths:
  /health:
    get:
      summary: Health check
      description: Returns service health status
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/auth/signup:
    post:
      summary: Register a new user
      description: Creates user account and issues JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "newuser@example.com"
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: "securePass123"
                timezone:
                  type: string
                  example: "Asia/Kolkata"
              required:
                - email
                - password
                - timezone
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Authenticate user
      description: Validates credentials and returns JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "securePass123"
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      summary: Get current authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/timezone:
    patch:
      summary: Update user timezone
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  example: "America/New_York"
              required:
                - timezone
      responses:
        '200':
          description: Timezone updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid IANA timezone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /api/habits:
    get:
      summary: List user habits with streaks (paginated)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Page size limit (max 100)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: includeArchived
          in: query
          description: Include archived habits in response
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paginated habits list with calculated streak data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHabits'
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

    post:
      summary: Create a new habit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Daily Meditation"
                description:
                  type: string
                  example: "15 minutes mindfulness session"
                category:
                  type: string
                  enum: [health, productivity, learning, fitness, other]
                  default: "other"
              required:
                - name
      responses:
        '201':
          description: Habit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /api/habits/{id}:
    get:
      summary: Get habit details with streaks and check-ins
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Habit detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (habit belongs to another user)
        '404':
          description: Habit not found

    put:
      summary: Update a habit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Habit Name"
                description:
                  type: string
                  example: "Updated description"
                category:
                  type: string
                  enum: [health, productivity, learning, fitness, other]
      responses:
        '200':
          description: Habit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Habit not found

    delete:
      summary: Delete a habit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Habit deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Habit not found

  /api/habits/{id}/archive:
    patch:
      summary: Archive a habit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Habit archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Habit not found

  /api/habits/{id}/check-ins:
    get:
      summary: Get paginated check-ins for a habit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of check-in events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCheckIns'
        '400':
          description: Invalid pagination parameters
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Habit not found

    post:
      summary: Record a check-in for a habit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: Optional local date (YYYY-MM-DD) for backfilling
                  example: "2026-09-09"
      responses:
        '201':
          description: Check-in recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
        '400':
          description: Invalid date or date is in the future
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Habit not found
        '409':
          description: Already checked in for this date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
